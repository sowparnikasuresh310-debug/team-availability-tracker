<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | TeamFlow</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">

</head>


<body>

    <div class="login-page">

        <div class="login-card">

            <div class="logo">
                ✦
            </div>

            <h1>
                TeamFlow
            </h1>

            <p class="subtitle">
                Team Availability Tracker
            </p>


            {% with messages = get_flashed_messages(
                with_categories=true
            ) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="login-message {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST">

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In →
                </button>

            </form>


            <div class="demo-login">

                <p>
                    <strong>Demo Admin</strong>
                    <br>
                    admin / admin123
                </p>

                <p>
                    <strong>Demo Member</strong>
                    <br>
                    ananya / user123
                </p>

            </div>

        </div>

    </div>

</body>

</html>
